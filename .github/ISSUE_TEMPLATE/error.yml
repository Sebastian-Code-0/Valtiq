name: Reportar un error
description: Algo no funciona o un número no cuadra.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. No pongas datos personales reales (nombres,
        montos de tus deudas): si hace falta un ejemplo, usa uno inventado.
  - type: textarea
    id: que_paso
    attributes:
      label: ¿Qué pasó?
      description: Lo que viste y lo que esperabas ver.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abre Deudas → Plan de pago
        2. Escribe 100.000 en "Extra al mes"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: ¿Dónde?
      options:
        - Android
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Valtiq
      description: Está en Ajustes → Acerca de.
      placeholder: "1.9.0"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas (opcional)
      description: Revisa que no muestren tus datos reales.
